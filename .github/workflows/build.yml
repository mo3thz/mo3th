name: Build Android TV Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Upload HTML Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo3th-tv-launcher-web
          path: index.html
