<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mo3th Launcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* السماح بالتمرير العمودي لأسفل */
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            padding: 40px; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 20px; }
        .logo { font-size: 32px; font-weight: bold; color: #e50914; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: #ffffff; }
        .clock-container { text-align: left; }
        #time { font-size: 36px; font-weight: 300; }
        #date { font-size: 14px; color: #888; }

        .section-title { font-size: 20px; margin: 25px 0 15px 0; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .grid { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; }
        
        .card {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            width: 180px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: #fff;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .card:focus, .card:hover, .banner-slider:focus {
            transform: scale(1.05);
            border-color: #ffffff;
            background: #292929;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .card i { font-size: 36px; }
        .card p { font-size: 16px; font-weight: 600; }

        /* معرض الصور مع تمكين الفوكس */
        .banner-slider {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a2a2a;
            transition: all 0.2s ease-in-out;
        }
        .banner-slider img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .banner-slider img.active {
            opacity: 1;
        }

        .fa-youtube { color: #ff0000; }
        .fa-film { color: #e50914; }
        .fa-gear { color: #00d2ff; }
        .fa-clapperboard { color: #ffb703; }
        .fa-star { color: #ff007f; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MO3TH <span>LAUNCHER</span></div>
        <div class="clock-container">
            <div id="time">00:00</div>
            <div id="date">Loading...</div>
        </div>
    </div>

    <!-- قسم التطبيقات -->
    <div class="section-title">التطبيقات والألعاب</div>
    <div class="grid">
        <a class="card" tabindex="0" href="intent://www.youtube.com#Intent;scheme=https;end">
            <i class="fa-brands fa-youtube"></i>
            <p>YouTube</p>
        </a>
        
        <a class="card" tabindex="0" href="intent://www.netflix.com#Intent;scheme=https;end">
            <i class="fa-solid fa-film"></i>
            <p>Netflix</p>
        </a>

        <a class="card" tabindex="0" href="intent:#Intent;action=android.settings.SETTINGS;end">
            <i class="fa-solid fa-gear"></i>
            <p>الإعدادات</p>
        </a>
    </div>

    <!-- قسم معرض الصور (تمت إضافة tabindex="0" للتنقل إليه بالريموت) -->
    <div class="section-title">معرض الصور والأبرز</div>
    <div class="banner-slider" tabindex="0">
        <img src="https://picsum.photos/800/300?random=1" class="slide active" alt="Slide 1">
        <img src="https://picsum.photos/800/300?random=2" class="slide" alt="Slide 2">
        <img src="https://picsum.photos/800/300?random=3" class="slide" alt="Slide 3">
    </div>

    <!-- قسم إضافي للتأكد من التمرير لأسفل -->
    <div class="section-title">الأفلام والترفيه</div>
    <div class="grid">
        <div class="card" tabindex="0">
            <i class="fa-solid fa-clapperboard"></i>
            <p>أحدث الأفلام</p>
        </div>
        <div class="card" tabindex="0">
            <i class="fa-solid fa-star"></i>
            <p>المفضلة</p>
        </div>
    </div>

    <script>
        // كود الساعة
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('ar-SA', { weekday: 'long', month: 'short', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // كود تحريك معرض الصور
        let currentSlide = 0;
        const slides = document.querySelectorAll('.banner-slider img');

        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        // جعل الشاشة تتبع العنصر المحدد تلقائياً عند النزول بالريموت
        document.addEventListener('focusin', (e) => {
            e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    </script>
</body>
</html>
